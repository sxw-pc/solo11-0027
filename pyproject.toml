[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakewatch"
version = "0.1.0"
description = "Offline data-lake file-layout and table-maintenance workbench"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lakewatch = "lakewatch.cli:main"

[tool.setuptools.packages.find]
include = ["lakewatch*"]

[tool.setuptools.package-data]
lakewatch = [
  "web/templates/*.html",
  "web/static/*",
  "fixtures/configs/*.yaml",
  "fixtures/lake/**/*.json",
  "fixtures/lake/**/*.parquet",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
